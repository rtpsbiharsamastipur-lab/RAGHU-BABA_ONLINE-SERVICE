<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #ff9933, #ffffff, #138808);
      --dark-blue: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
    
    header { 
      background: var(--primary-gradient); 
      border-bottom: 5px solid #138808;
      padding: 0.8rem 2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-logo { height: 65px; object-fit: contain; background: white; padding: 3px; border-radius: 50%; border: 2px solid #ff9933; }
    .header-logo-csc { height: 60px; object-fit: contain; background: white; padding: 5px; border-radius: 8px; border: 2px solid #0056b3; }
    .header-center { text-align: center; flex-grow: 1; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
    .header-center h1 { font-size: 1.8rem; font-weight: 800; color: #060606; letter-spacing: 1px; }
    .header-center p { font-size: 0.85rem; color: #1e293b; font-weight: 700; margin-top: 2px; }
    
    .ticker-bar { background: #dc2626; color: white; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: bold; overflow: hidden; }

    .user-bar { background: var(--dark-blue); color: white; padding: 0.5rem 2rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .wallet-badge { background: #1e293b; border: 1px solid #334155; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: bold; color: #4ade80; }
    .btn-exit { background: #dc2626; border: none; color: white; padding: 0.3rem 0.7rem; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    
    #loginPanel { max-width: 420px; margin: 4rem auto; background: var(--card-bg); padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid #ff9933; }
    .input-group { margin-bottom: 1.25rem; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #334155; }
    .input-group input { width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; }
    .input-group input:focus { border-color: var(--accent); outline: none; }
    .btn-submit { width: 100%; background: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-submit:hover { background: #1d4ed8; }

    .dashboard-view { display: none; }
    .section-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 1.2rem; color: #1e3a8a; border-left: 5px solid #ff9933; padding-left: 0.6rem; display: flex; justify-content: space-between; align-items: center; }
    
    .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
    
    .service-card { 
      background: var(--card-bg); 
      border-radius: 10px; 
      padding: 1.25rem; 
      cursor: pointer; 
      transition: all 0.2s; 
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .service-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    
    .sc-panfind { border-top: 5px solid #0284c7; background: linear-gradient(to bottom, #e0f2fe, #ffffff); }
    .sc-pandetails { border-top: 5px solid #059669; background: linear-gradient(to bottom, #d1fae5, #ffffff); }
    .sc-pan { border-top: 5px solid #1e3a8a; background: linear-gradient(to bottom, #f0f4ff, #ffffff); }
    .sc-aadhaar { border-top: 5px solid #ff9933; background: linear-gradient(to bottom, #fff7ed, #ffffff); }
    .sc-voter { border-top: 5px solid #138808; background: linear-gradient(to bottom, #f0fdf4, #ffffff); }
    .sc-kisan { border-top: 5px solid #15803d; background: linear-gradient(to bottom, #f0fdf4, #ffffff); }
    .sc-ayushman { border-top: 5px solid #fbbf24; background: linear-gradient(to bottom, #fefef2, #ffffff); }
    .sc-dl { border-top: 5px solid #dc2626; background: linear-gradient(to bottom, #fef2f2, #ffffff); }
    .sc-rtps { border-top: 5px solid #8b5cf6; background: linear-gradient(to bottom, #faf5ff, #ffffff); }

    .service-card h3 { font-size: 1.15rem; color: #0f172a; margin-bottom: 0.5rem; font-weight: bold; }
    .service-card p { font-size: 0.85rem; color: #475569; min-height: 2.5rem; line-height: 1.3; }
    .card-footer { margin-top: 1rem; text-align: right; font-weight: bold; font-size: 0.85rem; color: var(--accent); }

    .modal-work { display: none; background: var(--card-bg); border-top: 5px solid var(--accent); border-radius: 8px; padding: 2rem; margin-top: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
