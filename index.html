<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - B2B Digital Portal</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #ff9933, #ffffff, #138808);
      --dark-blue: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
    
    header { 
      background: var(--primary-grad); 
      border-bottom: 5px solid #138808;
      padding: 0.8rem 2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header-left, .header-right { display: flex; align-items: center; }
    .header-logo { height: 60px; background: white; padding: 4px; border-radius: 50%; border: 2px solid #ff9933; }
    .header-logo-csc { height: 55px; background: white; padding: 5px; border-radius: 6px; border: 2px solid #0056b3; }
    .header-center { text-align: center; flex-grow: 1; }
    .header-center h1 { font-size: 1.8rem; font-weight: 800; color: #060606; }
    .header-center p { font-size: 0.85rem; color: #1e293b; font-weight: 700; margin-top: 2px; }
    
    .ticker-bar { background: #dc2626; color: white; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: bold; }

    .user-bar { background: var(--dark-blue); color: white; padding: 0.6rem 2rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .wallet-badge { background: #1e293b; border: 1px solid #334155; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: bold; color: #4ade80; }
    .btn-exit { background: #dc2626; border: none; color: white; padding: 0.35rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    
    #loginWrapper { display: block; }
    #loginPanel { max-width: 440px; margin: 3rem auto; background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid #ff9933; }
    .input-box { margin-bottom: 1.2rem; }
    .input-box label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #334155; }
    .input-box input { width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; outline: none; }
    .input-box input:focus { border-color: var(--accent); }
    .btn-login { width: 100%; background: #2563eb; color: white; padding: 0.8rem; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-login:hover { background: #1d4ed8; }

    .dashboard-view { display: none; }
    .section-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 1.2rem; color: #1e3a8a; border-left: 5px solid #ff9933; padding-left: 0.6rem; display: flex; justify-content: space-between; align-items: center; }
    
    .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
    
    .service-card { 
      background: var(--card-bg); 
      border-radius: 10px; 
      padding: 1.25rem; 
      cursor: pointer; 
      transition: all 0.2s; 
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .service-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    
    .sc-panfind { border-top: 5px solid #0284c7; background: #f0f9ff; }
    .sc-pandetails { border-top: 5px solid #059669; background: #ecfdf5; }
    .sc-pan { border-top: 5px solid #1e3a8a; background: #eff6ff; }
    .sc-aadhaar { border-top: 5px solid #ff9933; background: #fff7ed; }
    .sc-voter { border-top: 5px solid #138808; background: #f0fdf4; }
    .sc-kisan { border-top: 5px solid #15803d; background: #f0fdf4; }
    .sc-ayushman { border-top: 5px solid #fbbf24; background: #fffbeb; }
    .sc-rtps { border-top: 5px solid #8b5cf6; background: #faf5ff; }

    .service-card h3 { font-size: 1.15rem; color: #0f172a; margin-bottom: 0.5rem; font-weight: bold; }
    .service-card p { font-size: 0.85rem; color: #475569; min-height: 2.5rem; line-height: 1.3; }
    .card-footer { margin-top: 1rem; text-align: right; font-weight: bold; font-size: 0.85rem; color: var(--accent); }

    .modal-work { display: none; background: var(--card-bg); border-top: 5px solid var(--accent); border-radius: 8px; padding: 2rem; margin-top: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .modal-work h2 { font-size: 1.3rem; margin-bottom: 1.2rem; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    
    #adminMasterSection { border-top: 5px solid #ea580c; background: #fff7ed; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
    .table-container { width: 100%; overflow-x: auto; margin-top: 0.8rem; background: white; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid #cbd5e1; padding: 0.6rem; text-align: left; }
    th { background: #f8fafc; }

    #printReceiptArea { display: none; background: white; padding: 1.5rem; border: 2px dashed #0f172a; border-radius: 6px; max-width: 600px; margin: 1.5rem auto; }
    .receipt-header { text-align: center; border-bottom: 1px solid #000; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .receipt-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
