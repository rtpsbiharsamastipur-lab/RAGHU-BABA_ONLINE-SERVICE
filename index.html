<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}
#particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
}
.particle {
    position: absolute;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: float linear infinite;
}
@keyframes float {
    0% {transform: translateY(0) translateX(0);}
    100% {transform: translateY(-120vh) translateX(20px);}
}
.brand-watermark {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10vw;
    color: rgba(255,255,255,0.05);
    font-family: 'Playfair Display', serif;
    z-index: 0;
    text-align: center;
    animation: fade 5s infinite alternate;
}
@keyframes fade {
    from {opacity: 0.05;}
    to {opacity: 0.1;}
}
.luxury-container {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 450px;
    margin: 20px auto;
    padding: 0 10px;
}
.luxury-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    border-radius: 20px;
    padding: 30px 20px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    text-align: center;
    color: #fff;
}
.brand-header .brand-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.8em;
    font-weight: 700;
}
.brand-header .brand-subtitle {
    font-size: 0.9em;
    letter-spacing: 1px;
    color: #ddd;
    margin-bottom: 15px;
}
.form-group {
    position: relative;
    margin-bottom: 20px;
}
.form-group input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1em;
}
.form-group input:focus {
    outline: none;
    box-shadow: 0 0 5px rgba(255,255,255,0.5);
}
.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 1.1em;
}
.submit-btn {
    width: 100%;
    background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
    color: white;
    padding: 12px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
.submit-btn:hover {
    transform: scale(1.03);
    opacity: 0.95;
}
.footer-links {
    margin-top: 15px;
    font-size: 0.85em;
}
.footer-links a {
    color: #ddd;
    text-decoration: none;
    margin: 0 4px;
}
.footer-links a:hover {
    text-decoration: underline;
}
.download-app-btn {
    background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}
.download-app-btn:hover {
    opacity: 0.85;
}
@media(max-width:400px){
    .brand-header .brand-logo {
        font-size: 1.5em;
    }
    .luxury-card {
        padding: 20px 15px;
    }
}
</style>
