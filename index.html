<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #1e1b4b;
      min-height: 100vh;
      padding: 20px 10px;
    }

    /* Top Bar */
    .top-header {
      max-width: 440px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: #2563eb;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Main Login Card - Solid Background (No Invisible Glitch) */
    .login-container {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-top: 5px solid #2563eb;
    }

    .brand-title {
      font-size: 20px;
      color: #0f172a;
      text-align: center;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .btn-login {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: #1d4ed8;
    }

    .help-box {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    /* Success Dashboard Screen (Default Hidden) */
    #dashboardView {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-header">
    Raghu Baba Digital Services
  </div>

  <!-- 1. LOGIN SCREEN -->
  <div class="login-container" id="loginCard">
    <div class="brand-title">RAGHU BABA ONLINE SERVICE</div>
    <div class="brand-subtitle">Digital Portal Login</div>

    <form onsubmit="handleDirectLogin(event)">
      <div class="form-group">
        <label>User ID / Mobile Number</label>
        <input type="text" id="userBox" placeholder="User ID दर्ज करें (जैसे admin)" required autocomplete="off">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passBox" placeholder="Password दर्ज करें" required autocomplete="off">
      </div>

      <button type="submit" class="btn-login" id="submitBtn">लॉगिन करें</button>
    </form>

    <div class="help-box">
      WhatsApp सहायता: <strong>8207827581</strong>
    </div>
  </div>

  <!-- 2. DASHBOARD VIEW (लॉगिन होते ही यह दिखेगा) -->
  <div id="dashboardView">
    <h2 style="color: #16a34a; margin-bottom: 10px;">🎉 लॉगिन सफल रहा!</h2>
    <p style="font-size: 14px; color: #334155; margin-bottom: 15px;">स्वागत है: <strong id="welcomeUser"></strong></p>
    <div style="background: #f1f5f9; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
      <p style="font-size: 13px; color: #475569;">पोर्टल डैशबोर्ड सक्रिय हो चुका है।</
