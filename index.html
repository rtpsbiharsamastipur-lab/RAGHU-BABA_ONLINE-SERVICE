<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGHU BABA ONLINE SERVICE - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.82), rgba(168, 85, 247, 0.82)), 
                  url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
    }

    /* Top Navigation Bar */
    .navbar {
      width: 90%;
      max-width: 980px;
      background: #ffffff;
      padding: 12px 24px;
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .brand {
      font-size: 18px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: 0.5px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-links a {
      text-decoration: none;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
    }
    .nav-btn-login {
      background: #2563eb;
      color: #ffffff !important;
      padding: 6px 16px;
      border-radius: 4px;
    }

    /* Login Box Container */
    .main-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      z-index: 10;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 28px;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    .login-box h2 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .login-box p.desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 22px;
    }

    /* Form Fields */
    .field-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .field-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .field-group input:focus {
      border-color: #4f46e5;
    }

    /* Buttons */
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-login:hover {
      opacity: 0.95;
    }

    .badge-secure {
      font-size: 12px;
      color: #16a34a;
      margin: 14px 0 16px;
      font-weight: 600;
    }

    .divider {
      position: relative;
      margin: 16px 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 32%;
      height: 1px;
      background: #e2e8f0;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .btn-support {
      width: 100%;
      padding: 9px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
    }

    .links-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
    }
    .links-footer a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    /* Bottom Copyright Bar */
    footer {
      width: 100%;
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 14px;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="brand">Raghu Baba Online Service</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#" class="nav-btn-login">Login</a>
      <a href="#">Register</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <!-- Center Login Box -->
  <div class="main-container">
    <div class="login-box">
      <h2>Welcome Back</h2>
      <p class="desc">Sign in to access your digital service account</p>

      <form onsubmit="doLogin(event)">
        <div class="field-group">
          <label>Username or Mobile ID</label>
          <input type="text" id="uid" placeholder="User ID / Mobile darj karein" required autocomplete="off">
        </div>

        <div class="field-group">
          <label>Password</label>
          <input type="password" id="upw" placeholder="Password darj karein" required autocomplete="off">
        </div>

        <button type="submit" class="btn-login" id="subBtn">Sign In</button>

        <div class="badge-secure">🛡️ SSL 256-bit Secure Verified</div>

        <div class="divider">Or quick connect</div>
